[workspace]
members = ["crates/seashell-core", "crates/seashell-snapshot", "crates/seashell-replay"]
exclude = ["programs/account-loader", "programs/sysvar", "programs/create-account", "programs/sysvar_ixns", "programs/cpi-caller", "programs/token-transfer", "programs/anchor-transfer", "programs/sbpf-v3"]
resolver = "2"

[workspace.dependencies]
addr2line = "0.24"
agave-feature-set = { path = "../agave/feature-set",features = ["agave-unstable-api"] }
agave-precompiles = { path = "../agave/precompiles",features = ["agave-unstable-api"] }
agave-reserved-account-keys = { path = "../agave/reserved-account-keys",features = ["agave-unstable-api"] }
base64 = "0.23.1"
bincode = "1.3.3"
cc = "1.2.56"
ed25519-dalek = "=1.0.1"
flate2 = "1.0.32"
gimli = { version = "0.31", default-features = false, features = ["read", "std", "endian-reader"] }
indexmap = "2.9.0"
inferno = "0.12"
libsecp256k1 = "0.6.0"
log = "0.4.27"
object = "0.36"
openssl = "0.10.72"
parking_lot = "0.12.1"
rand = "0.7"
rustc-demangle = "0.1"
serde = "1.0.208"
serde_json = "1.0.141"
serde_with = { version = "3.9.0", features = ["hex"] }
solana-account = "5.1.1"
solana-bpf-loader-program = { path = "../agave/programs/bpf_loader",default-features = false, features = ["agave-unstable-api"] }
solana-builtins = { path = "../agave/builtins",features = ["agave-unstable-api"] }
solana-clock = "4.0.0"
solana-compute-budget = { path = "../agave/compute-budget",features = ["agave-unstable-api"] }
solana-compute-budget-instruction = { path = "../agave/compute-budget-instruction",features = ["agave-unstable-api"] }
solana-message = "6.0.0"
solana-svm-transaction = "8.0.0"
solana-transaction = { version = "6.0.0", features = ["wincode"] }
zstd = "0.14.3"
solana-ed25519-program = "3.0.0"
solana-epoch-rewards = "3.0.0"
solana-epoch-schedule = "3.0.0"
solana-hash = "4.6.0"
solana-instruction = "4.0.0"
solana-instruction-error = "3.1.0"
solana-instructions-sysvar = { version = "5.0.0",features = ["dev-context-only-utils"] }
solana-logger = "2.3"
solana-precompile-error = "3.0.0"
solana-program-runtime = { path = "../agave/program-runtime",features = ["agave-unstable-api", "dev-context-only-utils"] }
solana-pubkey = "4.3.0"
solana-rent = "4.4.0"
solana-rpc-client = { path = "../agave/rpc-client",default-features = false }
solana-rpc-client-api = { path = "../agave/rpc-client-api" }
solana-sbpf = { path = "../sbpf", features = ["execution-timing"] }
solana-sdk-ids = "3.0.0"
solana-secp256k1-program = "3.0.0"
solana-secp256r1-program = "3.0.0"
solana-slot-hashes = "4.0.0"
solana-stake-interface = "5.1.1"
solana-svm-callback = { path = "../agave/svm-callback",features = ["agave-unstable-api"] }
solana-svm-log-collector = { path = "../agave/svm-log-collector",features = ["agave-unstable-api"] }
solana-svm-timings = { path = "../agave/svm-timings",features = ["agave-unstable-api"] }
solana-syscalls = { path = "../agave/syscalls",default-features = false, features = ["agave-unstable-api"] }
solana-sysvar = "5.0.0"
solana-sysvar-id = "3.0.0"
solana-transaction-context = { path = "../agave/transaction-context",features = ["agave-unstable-api", "wincode", "dev-context-only-utils"] }
quasar-profile = { git = "https://github.com/blueshift-gg/quasar" }
tempfile = "3.8"
thiserror = "2.0.12"
wincode = "0.6.3"
