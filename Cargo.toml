[workspace]
members = ["crates/seashell-core"]
exclude = ["programs/account-loader", "programs/sysvar", "programs/create-account", "programs/sysvar_ixns", "programs/cpi-caller"]
resolver = "2"

[workspace.dependencies]
addr2line = "0.24"
agave-feature-set = "3.0.3"
agave-precompiles = "3.0.3"
agave-syscalls = "3.0.3"
bincode = "1.3.3"
ed25519-dalek = "=1.0.1"
flate2 = "1.0.32"
gimli = { version = "0.31", default-features = false, features = ["read", "std", "endian-reader"] }
indexmap = "2.9.0"
inferno = "0.12"
libsecp256k1 = "0.6.0"
log = "0.4.27"
object = "0.36"
openssl = "0.10.72"
parking_lot = "0.12.1"
rand = "0.7"
rustc-demangle = "0.1"
serde = "1.0.208"
serde_json = "1.0.141"
serde_with = { version = "3.9.0", features = ["hex"] }
solana-account = "3.0"
solana-bpf-loader-program = "3.0.3"
solana-builtins = "3.0.3"
solana-clock = "3.0"
solana-compute-budget = "3.0.0"
solana-ed25519-program = "3.0.0"
solana-epoch-rewards = "3.0.0"
solana-epoch-schedule = "3.0.0"
solana-hash = "3.0.0"
solana-instruction = "3.0.0"
solana-instructions-sysvar = { version = "3.0.0", features = ["dev-context-only-utils"] }
solana-logger = "2.3"
solana-precompile-error = "3.0.0"
solana-program-runtime = "3.0.3"
solana-pubkey = "3.0.0"
solana-rent = "3.0.0"
solana-rpc-client = "3.0"
solana-rpc-client-api = "3.0"
solana-sbpf = "0.12.2"
solana-sdk-ids = "3.0.0"
solana-secp256k1-program = "3.0.0"
solana-secp256r1-program = "3.0.0"
solana-slot-hashes = "3.0.0"
solana-stake-interface = "2.0.1"
solana-stake-program = "3.0.3"
solana-svm-callback = "3.0.3"
solana-svm-log-collector = "3.0.3"
solana-svm-timings = "3.0.3"
solana-sysvar = "3.0.0"
solana-sysvar-id = "3.0.0"
solana-transaction-context = { version = "3.0.3", features = ["dev-context-only-utils"] }
tempfile = "3.8"
thiserror = "2.0.12"

[patch.crates-io]
solana-sbpf = { git = "https://github.com/soundsonacid/sbpf", branch = "main" }

agave-feature-set                      = { git = "https://github.com/soundsonacid/agave", branch = "master" }
agave-precompiles                      = { git = "https://github.com/soundsonacid/agave", branch = "master" }
agave-syscalls                         = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-account-decoder-client-types    = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-bpf-loader-program              = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-builtins                        = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-compute-budget                  = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-compute-budget-program          = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-curve25519                      = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-loader-v4-program               = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-poseidon                        = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-program-runtime                 = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-rpc-client                      = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-rpc-client-api                  = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-rpc-client-types                = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-stake-program                   = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-svm-callback                    = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-svm-feature-set                 = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-svm-log-collector               = { git = "https://github.com/soundsonacid/agave", branch = "master" }
