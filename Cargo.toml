solana-svm-timings                     = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-svm-transaction                 = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-svm-type-overrides              = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-system-program                  = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-transaction-context             = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-transaction-status-client-types = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-version                         = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-vote-program                    = { git = "https://github.com/soundsonacid/agave", branch = "master" }
solana-zk-elgamal-proof-program        = { git = "https://github.com/soundsonacid/agave", branch = "master" }
