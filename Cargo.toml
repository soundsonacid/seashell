[workspace]
members = ["crates/seashell-core"]
exclude = ["programs/account-loader", "programs/sysvar", "programs/create-account", "programs/sysvar_ixns", "programs/cpi-caller", "programs/token-transfer", "programs/anchor-transfer", "programs/sbpf-v3", "programs/sol-math"]
resolver = "2"

[workspace.dependencies]
addr2line = "0.24"
agave-feature-set = { git = "https://github.com/soundsonacid/agave", rev = "3fc6e8afa4a7690f01f48c90579eca12f00282aa", features = ["agave-unstable-api"] }
agave-precompiles = { git = "https://github.com/soundsonacid/agave", rev = "3fc6e8afa4a7690f01f48c90579eca12f00282aa", features = ["agave-unstable-api"] }
bincode = "1.3.3"
ed25519-dalek = "=1.0.1"
flate2 = "1.0.32"
gimli = { version = "0.31", default-features = false, features = ["read", "std", "endian-reader"] }
indexmap = "2.9.0"
inferno = "0.12"
libsecp256k1 = "0.6.0"
log = "0.4.27"
object = "0.36"
openssl = "0.10.72"
parking_lot = "0.12.1"
rand = "0.7"
rustc-demangle = "0.1"
serde = "1.0.208"
serde_json = "1.0.141"
serde_with = { version = "3.9.0", features = ["hex"] }
solana-account = "5.1.1"
solana-bpf-loader-program = { git = "https://github.com/soundsonacid/agave", rev = "3fc6e8afa4a7690f01f48c90579eca12f00282aa", default-features = false, features = ["agave-unstable-api"] }
solana-builtins = { git = "https://github.com/soundsonacid/agave", rev = "3fc6e8afa4a7690f01f48c90579eca12f00282aa", features = ["agave-unstable-api"] }
solana-clock = { version = "4.0.0", features = ["serde"] }
solana-compute-budget = { git = "https://github.com/soundsonacid/agave", rev = "3fc6e8afa4a7690f01f48c90579eca12f00282aa", features = ["agave-unstable-api"] }
solana-ed25519-program = "3.0.0"
solana-epoch-rewards = { version = "3.2.0", features = ["serde"] }
solana-epoch-schedule = { version = "3.4.0", features = ["serde"] }
solana-hash = "4.7.0"
solana-instruction = "4.0.0"
solana-instruction-error = "3.1.0"
solana-instructions-sysvar = { version = "5.0.0", features = ["dev-context-only-utils"] }
solana-logger = "2.3"
solana-precompile-error = "3.0.0"
solana-program-runtime = { git = "https://github.com/soundsonacid/agave", rev = "3fc6e8afa4a7690f01f48c90579eca12f00282aa", features = ["agave-unstable-api", "dev-context-only-utils"] }
solana-pubkey = "4.4.0"
solana-rent = { version = "4.5.0", features = ["serde"] }
solana-rpc-client = { git = "https://github.com/soundsonacid/agave", rev = "3fc6e8afa4a7690f01f48c90579eca12f00282aa", default-features = false }
solana-rpc-client-api = { git = "https://github.com/soundsonacid/agave", rev = "3fc6e8afa4a7690f01f48c90579eca12f00282aa" }
solana-sbpf = { git = "https://github.com/soundsonacid/sbpf", branch = "sol-math" }
solana-sdk-ids = "3.1.0"
solana-secp256k1-program = "3.1.0"
solana-secp256r1-program = "3.0.0"
solana-slot-hashes = { version = "4.0.0", features = ["serde"] }
solana-stake-interface = { version = "5.1.1", features = ["serde"] }
solana-svm-callback = { git = "https://github.com/soundsonacid/agave", rev = "3fc6e8afa4a7690f01f48c90579eca12f00282aa", features = ["agave-unstable-api"] }
solana-svm-log-collector = { git = "https://github.com/soundsonacid/agave", rev = "3fc6e8afa4a7690f01f48c90579eca12f00282aa", features = ["agave-unstable-api"] }
solana-svm-timings = { git = "https://github.com/soundsonacid/agave", rev = "3fc6e8afa4a7690f01f48c90579eca12f00282aa", features = ["agave-unstable-api"] }
solana-syscalls = { git = "https://github.com/soundsonacid/agave", rev = "3fc6e8afa4a7690f01f48c90579eca12f00282aa", default-features = false, features = ["agave-unstable-api"] }
solana-sysvar = { version = "5.0.0", features = ["serde"] }
solana-sysvar-id = "3.1.0"
solana-transaction-context = { git = "https://github.com/soundsonacid/agave", rev = "3fc6e8afa4a7690f01f48c90579eca12f00282aa", features = ["agave-unstable-api", "wincode", "dev-context-only-utils"] }
quasar-profile = { git = "https://github.com/blueshift-gg/quasar" }
tempfile = "3.8"
thiserror = "2.0.12"
